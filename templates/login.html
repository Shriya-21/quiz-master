{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="container-fluid min-vh-75 d-flex align-items-center justify-content-center position-relative overflow-hidden pt-5">
    <div class="card p-4 shadow-lg" style="width: 350px; background-color: #333; color: white; border-radius: 5px;">
        <h2 class="text-light mb-3">Login</h2>

        <form method="POST">
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" name="email" id="email" class="form-control bg-dark text-white" required>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Password</label>
                <div class="position-relative">
                    <input type="password" id="password" class="form-control pe-5 bg-dark text-white" placeholder="Password" name="password" required>
                    <span class="position-absolute top-50 end-0 translate-middle-y me-3" style="cursor: pointer;" onclick="togglePassword()">
                    <i class="fa-solid fa-eye" id="togglePasswordIcon"></i>
                    </span>
                </div>
            </div>
            <button type="submit" class="btn btn-warning w-100">Login</button>
        </form>

        <div class="mt-3 text-center">
            <p>Don't have an account? <a href="{{ url_for('register') }}" class="text-warning">Register</a></p>
        </div>
    </div>
</div>

<script>
    function togglePassword() {
      const passwordInput = document.getElementById("password");
      const icon = document.getElementById("togglePasswordIcon");
      
      if (passwordInput.type === "password") {
        passwordInput.type = "text";
        icon.classList.remove("fa-eye");
        icon.classList.add("fa-eye-slash");
      } else {
        passwordInput.type = "password";
        icon.classList.remove("fa-eye-slash");
        icon.classList.add("fa-eye");
      }
    }
  </script>
{% endblock %}
