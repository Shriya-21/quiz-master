{% extends "base.html" %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-lg p-4 rounded" style="background-color: #F9F3D7; border: none;">
                <div class="row align-items-center">
                    
                    <!-- Profile Icon Section -->
                    <div class="col-md-4 text-center">
                        <!-- Font Awesome Icon -->
                        <i class="fas fa-user-circle fa-7x mb-3" style="color: #C2A875;"></i>

                        <!-- Fallback Profile Image -->
                        <div class="fallback-profile d-none" 
                             style="width: 100px; height: 100px; border-radius: 50%; background-color: #C2A875; display: flex; align-items: center; justify-content: center;">
                            <span style="font-size: 2rem; color: white;">A</span>
                        </div>
                    </div>

                    <!-- Profile Details Section -->
                    <div class="col-md-8">
                        <h4 class="fw-bold" style="color: #5A4A2E;">{{ admin.full_name }}</h4>
                        <p class="mb-1" style="color: #5A4A2E;"><strong>Email:</strong> {{ admin.email }}</p>
                        <p class="mb-3" style="color: #5A4A2E;"><strong>DOB:</strong> {{ admin.dob.strftime('%Y-%m-%d') if admin.dob else 'N/A' }}</p>
                        
                        <hr style="border-color: #C2A875;">

                        <!-- Buttons Section -->
                        <div class="d-flex gap-3">
                            <a href="{{ url_for('edit_profile') }}" class="btn px-4 py-2"
                               style="background-color: #E0C785; color: #5A4A2E; font-weight: bold;">
                                <i class="fas fa-edit"></i> Edit Profile
                            </a>
                            <a href="{{ url_for('change_password') }}" class="btn px-4 py-2"
                               style="background-color: #D1B074; color: #5A4A2E; font-weight: bold;">
                                <i class="fas fa-key"></i> Change Password
                            </a>
                        </div>
                    </div>

                </div>
            </div>
        </div> 
    </div>
</div>
{% endblock %}
