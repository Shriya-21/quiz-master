{% extends "base.html" %}

{% block title %}Add Chapter{% endblock %}

{% block content %}
<div class="container mt-4">
    <h2 class="mb-4" style="color: black;">Add Chapter to {{ subject.name }}</h2>
    <form method="POST">
        <div class="mb-3">
            <label class="form-label fw-bold" style="color: #3f2700;">Chapter Name</label>
            <input type="text" class="form-control" name="name" required style="border: 1px solid #D4AC0D; background-color: #FCF3CF;">
        </div>
        <div class="mb-3">
            <label class="form-label fw-bold" style="color: #3f2700;">Description</label>
            <textarea class="form-control" name="description" style="border: 1px solid #D4AC0D; background-color: #FCF3CF;"></textarea>
        </div>
        <button type="submit" class="btn" style="background-color: black; color: white;">Add Chapter</button>
        <a href="{{ url_for('admin_subjects') }}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
