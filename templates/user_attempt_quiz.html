{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h2>{{ quiz.name }}</h2>
    <p><strong>Time Limit:</strong> {{ quiz.quiz_duration }} minutes</p>
    <p><strong>Time Remaining: <span id="timer"></span></strong></p>

    <form id="quiz-form" method="POST" action="{{ url_for('submit_quiz', quiz_id=quiz.quiz_id) }}">
        {% for question in quiz.questions %}
            <div class="mb-4">
                <p><strong>{{ loop.index }}. {{ question.text }}</strong></p>
                <div>
                    <label>
                        <input type="radio" name="question_{{ question.id }}" value="A"> {{ question.option_a }}
                    </label>
                </div>
                <div>
                    <label>
                        <input type="radio" name="question_{{ question.id }}" value="B"> {{ question.option_b }}
                    </label>
                </div>
                <div>
                    <label>
                        <input type="radio" name="question_{{ question.id }}" value="C"> {{ question.option_c }}
                    </label>
                </div>
                <div>
                    <label>
                        <input type="radio" name="question_{{ question.id }}" value="D"> {{ question.option_d }}
                    </label>
                </div>
            </div>
        {% endfor %}

        <button type="submit" class="btn btn-success">Submit Quiz</button>
    </form>
</div>

<script>
    let timeLimit = {{ quiz.quiz_duration }} * 60; 
    const timerDisplay = document.getElementById("timer");
    const quizForm = document.getElementById("quiz-form");

    function updateTimer() {
        let minutes = Math.floor(timeLimit / 60);
        let seconds = timeLimit % 60;
        timerDisplay.textContent = `${minutes}:${seconds < 10 ? "0" : ""}${seconds}`;
        timeLimit--;

        if (timeLimit < 0) {
            clearInterval(timerInterval);
            alert("Time is up! Submitting your quiz...");
            quizForm.submit();
        }
    }

    updateTimer();
    let timerInterval = setInterval(updateTimer, 1000);

    function preventBack() {
        history.pushState(null, null, location.href);
    }

    preventBack();
    window.addEventListener("popstate", function () {
        alert("Back navigation detected! Your quiz is being submitted.");
        quizForm.submit();
    });

    function warnBeforeUnload(event) {
        event.preventDefault();
        event.returnValue = "Are you sure you want to leave? Your quiz will be submitted!";
    }

    window.addEventListener("beforeunload", warnBeforeUnload);

    quizForm.addEventListener("submit", function () {
        window.removeEventListener("beforeunload", warnBeforeUnload);
    });
</script>


{% endblock %}
