{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h2 class="text-center mb-4 fw-bold text-dark">Change Password</h2>

    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-lg border-0 rounded-4 p-4" style="background-color: #fff3e0;">
                <div class="card-body">
                    <form method="POST">
                        <!-- Lock Icon -->
                        <div class="text-center mb-3">
                            <i class="fas fa-lock" style="font-size: 80px; color: #3e2723;"></i>
                        </div>

                        <!-- Current Password -->
                        <div class="mb-3">
                            <label class="form-label fw-medium">Current Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-key"></i></span>
                                <input type="password" name="current_password" class="form-control rounded-end-3" required>
                            </div>
                        </div>

                        <!-- New Password with Tooltip -->
                        <div class="mb-3">
                            <label class="form-label fw-medium">New Password</label>
                            <span class="tooltip-icon" data-bs-toggle="tooltip" title="Must be at least 8 characters, include an uppercase letter, a number, and a special character.">
                                <i class="fas fa-info-circle"></i>
                            </span>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-lock"></i></span>
                                <input type="password" name="new_password" class="form-control rounded-end-3" required>
                            </div>
                        </div>

                        <!-- Confirm New Password -->
                        <div class="mb-3">
                            <label class="form-label fw-medium">Confirm New Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-lock"></i></span>
                                <input type="password" name="confirm_password" class="form-control rounded-end-3" required>
                            </div>
                        </div>

                        <!-- Buttons -->
                        <div class="d-grid gap-2 mt-4">
                            <button type="submit" class="btn btn-dark btn-lg text-white">
                                <i class="fas fa-check"></i> Update Password
                            </button>
                            <a href="{{ url_for('user_profile') }}" class="btn btn-secondary btn-lg text-white">
                                <i class="fas fa-times"></i> Cancel
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        var tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'));
        var tooltipList = tooltipTriggerList.map(function (tooltipTriggerEl) {
            return new bootstrap.Tooltip(tooltipTriggerEl);
        });
    });
</script>
{% endblock %}
